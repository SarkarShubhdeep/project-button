name: Sync Issues to Redmine

on:
  issues:
    types: [opened, closed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create or Update Redmine Ticket
        env:
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_ISSUE_STATE: ${{ github.event.issue.state }}
          GITHUB_ISSUE_URL: ${{ github.event.issue.html_url }}
          GITHUB_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Project Button project ID
          PROJECT_ID=1
          
          # Tracker: Feature
          TRACKER_ID=2
          
          # Status IDs verified below
          
          if [ "$GITHUB_ACTION" = "opened" ]; then
            # Create new Redmine issue
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -H "X-Redmine-API-Key: $REDMINE_API_KEY" \
              -d "{
                \"issue\": {
                  \"project_id\": $PROJECT_ID,
                  \"tracker_id\": $TRACKER_ID,
                  \"subject\": \"[GH-$GITHUB_ISSUE_NUMBER] $GITHUB_ISSUE_TITLE\",
                  \"description\": \"Synced from GitHub Issue #$GITHUB_ISSUE_NUMBER\n\n$GITHUB_ISSUE_BODY\n\n---\nGitHub URL: $GITHUB_ISSUE_URL\"
                }
              }" \
              "$REDMINE_URL/issues.json")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            if [ "$HTTP_CODE" = "201" ]; then
              REDMINE_ID=$(echo "$BODY" | jq -r '.issue.id')
              echo "✓ Created Redmine issue #$REDMINE_ID"
              
              # Update GitHub issue with Redmine link using GitHub API
              curl -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"body\":\"🔗 Synced to Redmine: $REDMINE_URL/issues/$REDMINE_ID\"}" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$GITHUB_ISSUE_NUMBER/comments"
            else
              echo "✗ Failed to create issue (HTTP $HTTP_CODE)"
              echo "$BODY"
              exit 1
            fi
            
          elif [ "$GITHUB_ACTION" = "closed" ]; then
            # Find Redmine issue by subject pattern
            SEARCH_RESPONSE=$(curl -s \
              -H "X-Redmine-API-Key: $REDMINE_API_KEY" \
              "$REDMINE_URL/issues.json?project_id=$PROJECT_ID&subject=%5BGH-$GITHUB_ISSUE_NUMBER%5D")
            
            REDMINE_ID=$(echo "$SEARCH_RESPONSE" | jq -r '.issues[0].id')
            
            if [ "$REDMINE_ID" != "null" ] && [ -n "$REDMINE_ID" ]; then
              # Close the Redmine issue (status_id=5 for Closed)
              curl -s -X PUT \
                -H "Content-Type: application/json" \
                -H "X-Redmine-API-Key: $REDMINE_API_KEY" \
                -d "{
                  \"issue\": {
                    \"status_id\": 5,
                    \"notes\": \"Closed via GitHub Issue #$GITHUB_ISSUE_NUMBER\"
                  }
                }" \
                "$REDMINE_URL/issues/$REDMINE_ID.json"
              
              echo "✓ Closed Redmine issue #$REDMINE_ID"
            else
              echo "⚠ No matching Redmine issue found for GH-$GITHUB_ISSUE_NUMBER"
            fi
          fi
